<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ithinkitsgallery</title>
  <link rel="stylesheet" href="gallery.css">
  <link rel="icon" href="https://www.image2url.com/r2/default/files/1791834630275-913dc283-a1ac-4d27-bcf9-c22b4c273fdc.ico" type="image/x-icon">
  </head>
<body>
  <div id="gameKey">
    <svg viewBox="0 0 100 100" width="45" height="45">
        <g fill="#ffd700" stroke="#b8860b" stroke-width="4" stroke-linejoin="round">
            <path d="M 45 43 H 85 V 57 H 72 V 50 H 62 V 57 H 52 V 50 H 45 Z" />
            <path fill-rule="evenodd" d="M 30 25 A 25 25 0 1 1 30 75 A 25 25 0 1 1 30 25 Z M 30 38 A 12 12 0 1 0 30 62 A 12 12 0 1 0 30 38 Z" />
        </g>
    </svg>
</div>
  <main>
  <div class="recipe-page">
    
      <div class="back-wrapper">
    <a href="ithinkitsgallery.html" class="back-button">← Назад</a>
  </div>
   <div class="gallery-container">
    <div class="gallery-image">
      <img class="bigpic" src="https://i.postimg.cc/bwGs7sYm/image.png"  alt="Картина">
    </div>

    <div class="gallery-info">
      <h1>«Очень крутая загадка, чтобы получить очень крутой код»</h1>
      <p> Эта загадка очень крутая :sunglasses:
</p>

    </div>
  </div>
  </main>
 <div class="footer-btn" id="footerBtn">
    Ответ
  </div>
 <div id="codePrompt">
    <h1>Вы точно хотите узнать ответ? напишите нет если хотите</h1>
    <input type="password" id="codeInput" placeholder="Да">
    <br>
    <button id="submitCode">OK</button>
    <p id="errorMsg">Неправильный ответ!</p>
  </div>

  <div class="footer-overlay" id="footerOverlay">
    <h2> скибиди
    </h2>
    <img src="https://i.postimg.cc/mDFRB3wn/image.png" style="width: 800px;" alt="skibidi">
 

    <button id="closeFooter">Закрыть</button>
  </div>
  
<script>
   const footerBtn = document.getElementById("footerBtn");
    const footerOverlay = document.getElementById("footerOverlay");
    const closeBtn = document.getElementById("closeFooter");

    const codePrompt = document.getElementById("codePrompt");
    const codeInput = document.getElementById("codeInput");
    const submitCode = document.getElementById("submitCode");
    const errorMsg = document.getElementById("errorMsg");

    const correctCode = "нет"; 

    footerBtn.addEventListener("click", () => {
      codePrompt.style.display = "block";
      codeInput.value = "";
      errorMsg.style.display = "none";
    });

    submitCode.addEventListener("click", () => {
      if (codeInput.value === correctCode) {
        codePrompt.style.display = "none";
        footerOverlay.classList.add("active");
      } else {
        errorMsg.style.display = "block";
      }
    });

    closeBtn.addEventListener("click", () => {
      footerOverlay.classList.remove("active");
    });

  (function initPhysicsKey() {
    if (localStorage.getItem("keyUnlocked") !== "true") {
        const existingKey = document.getElementById("gameKey");
        if (existingKey) existingKey.style.display = "none";
        return;
    }

    const key = document.getElementById("gameKey");
    if (!key) return;

    key.style.display = "block";

    let x = parseFloat(localStorage.getItem("keyX")) || (window.innerWidth / 2 - 22.5);
    let y = parseFloat(localStorage.getItem("keyY")) || 50;
    let vx = 0;
    let vy = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    const gravity = 0.6;
    const bounce = -0.55;
    const friction = 0.98;
    const floorOffset = 34;

    function updatePosition() {
        key.style.transform = `translate(${x}px, ${y}px)`;
    }

    function saveState() {
        localStorage.setItem("keyX", x);
        localStorage.setItem("keyY", y);
    }

    function physicsLoop() {
        if (!isDragging) {
            vy += gravity;
            vx *= friction;
            vy *= friction;

            x += vx;
            y += vy;

            const keyWidth = 45;
            const keyHeight = 45;

            if (y + keyHeight > window.innerHeight - floorOffset) {
                y = window.innerHeight - floorOffset - keyHeight;
                vy *= bounce;
                vx *= 0.8;
            }
            if (y < 0) {
                y = 0;
                vy *= bounce;
            }
            if (x + keyWidth > window.innerWidth) {
                x = window.innerWidth - keyWidth;
                vx *= bounce;
            }
            if (x < 0) {
                x = 0;
                vx *= bounce;
            }

            saveState();
        }

        checkDoorUnlock();
        updatePosition();
        requestAnimationFrame(physicsLoop);
    }

    function onStart(e) {
        isDragging = true;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;
        lastMouseX = pageX;
        lastMouseY = pageY;
        vx = 0;
        vy = 0;
    }

    function onMove(e) {
        if (!isDragging) return;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        vx = pageX - lastMouseX;
        vy = pageY - lastMouseY;

        x += vx;
        y += vy;

        lastMouseX = pageX;
        lastMouseY = pageY;
    }

    function onEnd() {
        if (isDragging) {
            isDragging = false;
        }
    }

    key.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    key.addEventListener("touchstart", onStart, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);

    function checkDoorUnlock() {
        const door = document.querySelector(".door");
        if (!door || localStorage.getItem("doorLocked") !== "true") return;

        const doorRect = door.getBoundingClientRect();
        const keyRect = key.getBoundingClientRect();

        const overlap = !(keyRect.right < doorRect.left || 
                          keyRect.left > doorRect.right || 
                          keyRect.bottom < doorRect.top || 
                          keyRect.top > doorRect.bottom);

        if (overlap) {
            localStorage.setItem("doorLocked", "false");
            localStorage.removeItem("keyUnlocked");
            alert("🔓 Вы открыли дверь ключом!");
            location.reload();
        }
    }

    physicsLoop();
})();
  </script>
</body>

</html>
