<!DOCTYPE html>
<html lang="en">
<head>

  </head>
<body>
  <div id="gameKey">
    <svg viewBox="0 0 100 100" width="45" height="45">
        <g fill="#ffd700" stroke="#b8860b" stroke-width="4" stroke-linejoin="round">
            <path d="M 45 43 H 85 V 57 H 72 V 50 H 62 V 57 H 52 V 50 H 45 Z" />
            <path fill-rule="evenodd" d="M 30 25 A 25 25 0 1 1 30 75 A 25 25 0 1 1 30 25 Z M 30 38 A 12 12 0 1 0 30 62 A 12 12 0 1 0 30 38 Z" />
        </g>
    </svg>
</div>
  <main>
  <div class="recipe-page">
    
      <div class="back-wrapper">
    <a href="yrellag.html" class="back-button">← Назад</a>
  </div>
   <div class="gallery-container">
    <div class="gallery-image">
      <img class="grassy" src="https://img.goodfon.ru/wallpaper/big/d/b4/trava-zelen-tekstury-tekstura-travy-priroda.webp" alt="Картина">
    </div>

    <div class="gallery-info">
      <h1>«Картина номер 9 йоуу»</h1>
      <p><strong>Автор: цифра 9</strong> </p>
      <p> картина очень крутая, не все поймут эту картину. подписаться подумать
</p>
    </div>
  </div>
  </main>
 <div class="footer-btn" id="footerBtn">
    Про нас
  </div>

 
  <div class="footer-overlay" id="footerOverlay">
    <h2>не выделяй этот текст</h2>
 

    <button id="closeFooter">Выдели текст сверху </button>
  </div>
  
<script>

  const footerBtn = document.getElementById("footerBtn");
  const footerOverlay = document.getElementById("footerOverlay");
  const closeBtn = document.getElementById("closeFooter");

  footerBtn.addEventListener("click", () => {
    footerOverlay.classList.add("active");
  });

  closeBtn.addEventListener("click", () => {
    footerOverlay.classList.remove("active");
  });
</script>
</body>
</html>
