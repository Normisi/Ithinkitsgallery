<script>

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem("turpkaUnlocked") === "true") {

        mobileWarning.style.display = 'none';
    }
});

door.addEventListener("click", () => {
    door.style.animation = "open 0.8s ease forwards";
    p.style.opacity = '0';

    setTimeout(() => {
        scene.style.transition = "1s ease";
        scene.style.transform = "scale(5)";
        scene.style.filter = "brightness(5) saturate(1)";
        scene.style.opacity = '0';
        setTimeout(() => { location.href = "ithinkitsgallery.html" }, 500)
    }, 1050);
})

function wave(p, a = 10, f = 0.05, s = 0.05) {
    const text = p.textContent;
    p.textContent = '';
    const spans = [];
    for (let char of text) {
        const span = document.createElement('span');
        span.textContent = char;
        p.appendChild(span);
        spans.push(span);
    }
    let time = 0;
    function animate() {
        spans.forEach((span, i) => {
            span.style.transform = `translateY(${Math.sin(time + i * f) * a}px)`;
        });
        time += s;
        requestAnimationFrame(animate);
    }
    animate();
}
</script>
