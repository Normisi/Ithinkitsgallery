  <style>
body {
  background-image: url(https://png.klev.club/uploads/posts/2024-03/png-klev-club-p-myataya-bumaga-png-1.png);
  background-size: cover;
  font-family: "Segoe UI", sans-serif;
  margin: 0;
  padding: 0;
}

h1 {
  text-align: center;
  margin-top: 20px;
}

.chat-container {
  max-width: 700px;
  height: 70vh;
  background: rgba(255, 255, 255, 0.9);
  margin: 40px auto;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.chat-messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 70%;
  padding: 10px 15px;
  border-radius: 15px;
  line-height: 1.4em;
  word-wrap: break-word;
  opacity: 0;
  transform: translateY(20px);
  animation: appear 0.3s ease forwards;
}

@keyframes appear {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.user {
  align-self: flex-end;
  background: #d0ffd4;
}

.other {
  align-self: flex-start;
  background: #fff;
  border: 1px solid #ccc;
}

.chat-input {
  display: flex;
  border-top: 2px solid #888;
}

.chat-input input {
  flex: 1;
  border: none;
  padding: 12px;
  font-size: 16px;
  border-radius: 0 0 0 20px;
}

.chat-input button {
  background: #000;
  color: white;
  border: none;
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 0 0 20px 0;
  cursor: pointer;
}

.chat-input button:hover {
  background: #333;
}

.chat-messages::-webkit-scrollbar {
  width: 8px;
}
.chat-messages::-webkit-scrollbar-thumb {
  background: #aaa;
  border-radius: 4px;
}

<body>
  <div id="gameKey">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6fc3D-ZV5kDMNFISVeT7TSC0iGm2HUFILu7FjrGAEA&s=10" alt="key">
</div>
<div class="back-wrapper">
    <a href="ithinkitsgallery.html" class="back-button">← Назад</a>
  </div>
  
  <h1>💬 Чат бот! (без ИИ)</h1>

  <div class="chat-container">

    <div class="chat-messages" id="chatMessages">
    </div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Напишите что-то...">
      <button id="sendBtn">Отправить</button>
    </div>
  </div>

  <script>
  const chat = document.getElementById("chatMessages");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  let currentRole = "user";

  const keywords = [
    {
      words: ["НЕ", "Улыбка", "улыбка", "smile", "SMILE", "HE"],
      reply: '<a href="yrellag.html" target="_blank">привет :)</a>'
    },
    {
      words: ["Пиво", "пиво"],
      reply: 'спасибо хорошо'
    },
    {
      words: ["Ирон макс 2005", "ирон макс 2005"],
      reply: 'Только не он'
    },
    {
      words: ["813742"],
      reply: 'Тебе не сюда это писать бро'
    },
    {
      words: ["блебка"],
      reply: 'бебка'
    },
    {
      words: ["бедность","БЕДНОСТЬ"],
      reply: 'НЕ СМЕЙ ГОВОРИТЬ ЭТО СЛОВО'
    },
    {
      words: ["пивет","ПИВЕТ"],
      reply: '9'
    },
    {
      words: ["с др","С ДР"],
      reply: 'ищи ингредиенты в yrellag, в birtdaything (там где список), в 6 картине, и в 2 картине yrellag'
    },
    
  ];

  function addMessage(text, role, isHTML = false) {
    const div = document.createElement("div");
    div.classList.add("message", role);
    if (isHTML) div.innerHTML = text;
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function handleKeywords(text) {
    for (const { words, reply } of keywords) {
      if (words.some(word => text.toLowerCase().includes(word))) {
        addMessage(reply, "other", true);
      }
    }
  }

  sendBtn.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, currentRole);
    handleKeywords(text);
    input.value = "";
  });

  input.addEventListener("keypress", e => {
    if (e.key === "Enter") sendBtn.click();
  });
  function handleKeywords(text) {
  for (const { words, reply } of keywords) {
    if (words.some(word => text.toLowerCase().includes(word.toLowerCase()))) {
      addMessage(reply, "other", true);

     
      if (words.includes("бедность") || words.includes("БЕДНОСТЬ")) {
        document.body.style.transition = "background-color 3s";
        setTimeout(() => {
          window.location.href = "index.html"; 
        }, 700);
      }
    }
  }
  
}
(function initPhysicsKey() {
    const key = document.getElementById("gameKey");
    if (!key) return;

   
    let x = parseFloat(localStorage.getItem("keyX")) || (window.innerWidth / 2 - 35);
    let y = parseFloat(localStorage.getItem("keyY")) || 50;
    let vx = 0;
    let vy = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    const gravity = 0.6;      
    const bounce = -0.55;    
    const friction = 0.98;   

   
    function updatePosition() {
        key.style.transform = `translate(${x}px, ${y}px)`;
    }

   
    function saveState() {
        localStorage.setItem("keyX", x);
        localStorage.setItem("keyY", y);
    }

   
    function physicsLoop() {
        if (!isDragging) {
            vy += gravity; 
            vx *= friction;
            vy *= friction;

            x += vx;
            y += vy;

            const keyWidth = 45;
            const keyHeight = 45;

           
            if (y + keyHeight > window.innerHeight) {
                y = window.innerHeight - keyHeight;
                vy *= bounce;
                vx *= 0.8; 
            }
           
            if (y < 0) {
                y = 0;
                vy *= bounce;
            }
           
            if (x + keyWidth > window.innerWidth) {
                x = window.innerWidth - keyWidth;
                vx *= bounce;
            }
            if (x < 0) {
                x = 0;
                vx *= bounce;
            }

            saveState();
        }

       
        checkDoorUnlock();

        updatePosition();
        requestAnimationFrame(physicsLoop);
    }

   
    function onStart(e) {
        isDragging = true;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;
        lastMouseX = pageX;
        lastMouseY = pageY;
        vx = 0;
        vy = 0;
    }

    function onMove(e) {
        if (!isDragging) return;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        vx = pageX - lastMouseX;
        vy = pageY - lastMouseY;

        x += vx;
        y += vy;

        lastMouseX = pageX;
        lastMouseY = pageY;
    }

    function onEnd() {
        if (isDragging) {
            isDragging = false;
        }
    }

    key.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    key.addEventListener("touchstart", onStart, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);

  
    function checkDoorUnlock() {
        const door = document.querySelector(".door");
        if (!door || localStorage.getItem("doorLocked") !== "true") return;

        const doorRect = door.getBoundingClientRect();
        const keyRect = key.getBoundingClientRect();


        const overlap = !(keyRect.right < doorRect.left || 
                          keyRect.left > doorRect.right || 
                          keyRect.bottom < doorRect.top || 
                          keyRect.top > doorRect.bottom);

        if (overlap) {
         
            localStorage.setItem("doorLocked", "false");
            
       
            alert("🔓 Вы открыли дверь ключом!");
            location.reload();
        }
    }

    physicsLoop();
})();
</script>

</body>
