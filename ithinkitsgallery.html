  <h2> Музыка</h2> 
 <audio id="bgMusic" src="https://mp3tourl.com/audio/1791468299896-a3dbb201-be6d-4eff-8846-9cd91c70c62e.mp3" loop></audio>

  <button id="playButton">▶️ Включить музыку</button>

  <div class="volume-box">
    <label for="volumeControl">Громкость:</label>
    <input type="range" id="volumeControl" min="0" max="0.9" step="0.001" value="0.3">
  </div>


    <button id="closeFooter">Закрыть</button>
  </div>
  
<script>
    const footerBtn = document.getElementById("footerBtn");
    const footerOverlay = document.getElementById("footerOverlay");
    const closeBtn = document.getElementById("closeFooter");

    footerBtn.addEventListener("click", () => {
      footerOverlay.classList.add("active");
    });

    closeBtn.addEventListener("click", () => {
      footerOverlay.classList.remove("active");
    });
    const music = document.getElementById('bgMusic');
    const playButton = document.getElementById('playButton');
    const volumeControl = document.getElementById('volumeControl');

    music.volume = 0.3;

    playButton.addEventListener('click', () => {
      music.play().then(() => {
        playButton.style.display = 'none';
      }).catch(err => {
        alert('Хз, чёт не получилось включить музыку.');
      });
    });

    volumeControl.addEventListener('input', () => {
      music.volume = volumeControl.value;
    });
    const showGifBtn = document.getElementById('showGifBtn');
const loopGif = document.getElementById('loopGif');

showGifBtn.addEventListener('click', () => {
  loopGif.classList.toggle('visible');
});

  </script>
