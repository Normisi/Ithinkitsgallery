<script>
const door = document.querySelector(".door");
const scene = document.querySelector(".scene");
let p = document.getElementById("n");
let q = ['"Я съел человека" - Олень','У тебя же нету ключа чтобы открыть эту дверь?','Тебе тут не место. Вернись в галерею','"    " - Немой человек','"Ты зачем сюда пошёл" - человек (возможно)','"Картины это очень глубоко идея кросовки сегодня скачать" - Си Гма','"Искусство заменить это как ручка ложка съесть" - Скиб Идист', '"Если вашу картину критикуют, станцуйте брейкданс" - Яза Был', '"купи слона" - мявченко', '"Если ваши друзья ночь, будьте день" Мардцанікоченогелшкірабра', '"если" - народная мудрость','ты крутой:3'];
p.innerText = q[Math.floor(Math.random() * q.length)];
wave(p, 8, 0.2, 0.05);

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem("turpkaUnlocked") === "true") {
        const rightArrow = document.getElementById("rightArrow");
        if (rightArrow) {
            rightArrow.style.display = "block";
        }
    }

    const mobileWarning = document.getElementById('mobileWarning');
    if (window.innerWidth < 768) {
        mobileWarning.style.display = 'block';
    } else {
        mobileWarning.style.display = 'none';
    }
});

door.addEventListener("click", () => {
    door.style.animation = "open 0.8s ease forwards";
    p.style.opacity = '0';

    setTimeout(() => {
        scene.style.transition = "1s ease";
        scene.style.transform = "scale(5)";
        scene.style.filter = "brightness(5) saturate(1)";
        scene.style.opacity = '0';
        setTimeout(() => { location.href = "ithinkitsgallery.html" }, 500)
    }, 1050);
})

function wave(p, a = 10, f = 0.05, s = 0.05) {
    const text = p.textContent;
    p.textContent = '';
    const spans = [];
    for (let char of text) {
        const span = document.createElement('span');
        span.textContent = char;
        p.appendChild(span);
        spans.push(span);
    }
    let time = 0;
    function animate() {
        spans.forEach((span, i) => {
            span.style.transform = `translateY(${Math.sin(time + i * f) * a}px)`;
        });
        time += s;
        requestAnimationFrame(animate);
    }
    animate();
}

(function initPhysicsKey() {
    if (localStorage.getItem("keyUnlocked") !== "true") {
        const existingKey = document.getElementById("gameKey");
        if (existingKey) existingKey.style.display = "none";
        return;
    }

    const key = document.getElementById("gameKey");
    if (!key) return;

    key.style.display = "block";

    let x = parseFloat(localStorage.getItem("keyX")) || (window.innerWidth / 2 - 22.5);
    let y = parseFloat(localStorage.getItem("keyY")) || 50;
    let vx = parseFloat(localStorage.getItem("keyVX")) || 0;
    let vy = parseFloat(localStorage.getItem("keyVY")) || 0;
    let rot = parseFloat(localStorage.getItem("keyRot")) || 0;
    let vRot = parseFloat(localStorage.getItem("keyVR")) || 0;

    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    const gravity = 0.6;
    const bounce = -0.55;
    const friction = 0.98;
    const floorOffset = 34;

    function updatePosition() {
        key.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
    }

    function saveState() {
        localStorage.setItem("keyX", x);
        localStorage.setItem("keyY", y);
        localStorage.setItem("keyVX", vx);
        localStorage.setItem("keyVY", vy);
        localStorage.setItem("keyRot", rot);
        localStorage.setItem("keyVR", vRot);
    }

    function physicsLoop() {
        if (!isDragging) {
            vy += gravity;
            vx *= friction;
            vy *= friction;
            vRot *= 0.85;

            x += vx;
            y += vy;
            rot += vRot;

            const keyWidth = 45;
            const keyHeight = 45;

            if (y + keyHeight > window.innerHeight - floorOffset) {
                y = window.innerHeight - floorOffset - keyHeight;
                vy *= bounce;
                vRot += vx * 0.15; 
            }
            if (y < 0) {
                y = 0;
                vy *= bounce;
                vx *= 0.8;
            }
            if (x + keyWidth > window.innerWidth) {
                x = window.innerWidth - keyWidth;
                vx *= bounce;
                vRot -= vy * 0.15;
            }
            if (x < 0) {
                x = 0;
                vx *= bounce;
                vRot += vy * 0.15;
            }

            saveState();
        } else {
            vRot *= 0.8;
        }

        checkDoorUnlock();
        updatePosition();
        requestAnimationFrame(physicsLoop);
    }

    function onStart(e) {
        isDragging = true;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;
        lastMouseX = pageX;
        lastMouseY = pageY;
        vx = 0;
        vy = 0;
    }

    function onMove(e) {
        if (!isDragging) return;
        const pageX = e.touches ? e.touches[0].clientX : e.clientX;
        const pageY = e.touches ? e.touches[0].clientY : e.clientY;

        const moveX = pageX - lastMouseX;
        const moveY = pageY - lastMouseY;

        vx = moveX;
        vy = moveY;

        let targetRot = moveX * 1.0;
        rot += (targetRot - rot) * 0.3;
        vRot = moveX * 0.3;

        x += moveX;
        y += moveY;

        lastMouseX = pageX;
        lastMouseY = pageY;
    }

    function onEnd() {
        if (isDragging) {
            isDragging = false;
            vx *= 1.2;
            vy *= 1.2;
        }
    }

    key.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    key.addEventListener("touchstart", onStart, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);

    function checkDoorUnlock() {
        const door = document.querySelector(".door");
        if (!door || localStorage.getItem("doorLocked") !== "true") return;

        const doorRect = door.getBoundingClientRect();
        const keyRect = key.getBoundingClientRect();

        const overlap = !(keyRect.right < doorRect.left || 
                          keyRect.left > doorRect.right || 
                          keyRect.bottom < doorRect.top || 
                          keyRect.top > doorRect.bottom);

        if (overlap) {
            localStorage.setItem("doorLocked", "false");
            localStorage.removeItem("keyUnlocked");
            localStorage.removeItem("keyX");
            localStorage.removeItem("keyY");
            localStorage.removeItem("keyRot");
            localStorage.removeItem("keyVX");
            localStorage.removeItem("keyVY");
            localStorage.removeItem("keyVR");
            alert("🔓 Вы открыли дверь ключом!");
            location.reload();
        }
    }

    physicsLoop();
})();
</script>
